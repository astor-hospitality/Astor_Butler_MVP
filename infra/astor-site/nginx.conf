# Статика Astor внутри контейнера astor-site. TLS, сжатие и заголовки безопасности
# для публичного имени добавляет edge-Caddy (astor.caddy); здесь - только раздача файлов.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Страницы и данные не кэшируем: сайт обновляется git pull без сборки и версий в URL.
    expires -1;

    # Служебные файлы репозитория наружу не отдаём.
    location ~ /\. { return 404; }
    location ^~ /server/ { return 404; }
    location ^~ /tests/ { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # css/js подключены без ?v=, поэтому после git pull они не должны жить в кэше:
    # браузер каждый раз перепроверяет их (no-cache), страницы не ломаются старыми стилями.
    location ~* \.(?:css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    # Картинки и шрифты меняются редко и версионируются через ?v= - неделя в кэше.
    location ~* \.(?:svg|png|jpe?g|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
