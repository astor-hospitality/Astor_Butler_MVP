# Презентационный сайт Astor (frontend/astor-butler) - чистая статика за общим edge-Caddy
# на ВМ Cloud.ru. Контейнер только отдаёт файлы из checkout'а репозитория, сборки нет:
# `git pull` в /opt/astor-site обновляет сайт без перезапуска. Запуск и проверка - README.md.
services:
  astor-site:
    image: nginx:1.27-alpine
    container_name: astor-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ${ASTOR_SITE_ROOT:-/opt/astor-site}/frontend/astor-butler:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  # Сеть общего Caddy (vedal-proxy); в ней же c3ag-frontend и astor-api-gateway.
  edge:
    external: true
