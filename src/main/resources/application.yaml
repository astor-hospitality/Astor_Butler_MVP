astor:
  model:
    provider: ${ASTOR_MODEL_PROVIDER:spring-ai}
    # provider=openai-compatible: any service with the OpenAI HTTP API (chat/completions, embeddings).
    # Model names are the service's own, see its GET /models. Without a vision or embedding model
    # those two calls answer with a fallback instead of calling the service.
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      model: ${OPENAI_COMPATIBLE_MODEL:}
      quality-model: ${OPENAI_COMPATIBLE_QUALITY_MODEL:}
      vision-model: ${OPENAI_COMPATIBLE_VISION_MODEL:}
      embedding-model: ${OPENAI_COMPATIBLE_EMBEDDING_MODEL:}
      timeout-ms: ${OPENAI_COMPATIBLE_TIMEOUT_MS:15000}
      max-tokens: ${OPENAI_COMPATIBLE_MAX_TOKENS:256}
      # A negative temperature is not sent at all, for models that accept only their default.
      temperature: ${OPENAI_COMPATIBLE_TEMPERATURE:0.1}
      json-mode: ${OPENAI_COMPATIBLE_JSON_MODE:true}
      # Persona for free-text replies (what the Yandex AI Studio agent carried), read once at startup.
      # JSON understanding calls are sent without it. Empty: no system message.
      system-prompt-file: ${OPENAI_COMPATIBLE_SYSTEM_PROMPT_FILE:}
  redis:
    fsm-ttl-seconds: ${FSM_REDIS_TTL_SECONDS:259200}
    idempotency-ttl-seconds: ${IDEMPOTENCY_REDIS_TTL_SECONDS:86400}
    key-prefix: ${ASTOR_REDIS_KEY_PREFIX:astor}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    log-published-events: ${KAFKA_LOG_PUBLISHED_EVENTS:true}
    analytics-admin-chat-enabled: ${KAFKA_ANALYTICS_ADMIN_CHAT_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    user-events-topic: ${KAFKA_USER_EVENTS_TOPIC:astor.user.events}
    outbox-user-events-topic: ${KAFKA_OUTBOX_USER_EVENTS_TOPIC:astor.user.events}
    analytics-group-id: ${KAFKA_ANALYTICS_GROUP_ID:astor-admin-events}
    user-events-partitions: ${KAFKA_USER_EVENTS_PARTITIONS:3}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    outbox-enabled: ${KAFKA_OUTBOX_ENABLED:true}
  media:
    menu-dir: ${ASTOR_MEDIA_MENU_DIR:./media/menu/}
    aeris:
      menu:
        kitchen-object-key: ${AERIS_MENU_KITCHEN_OBJECT_KEY:content/aeris/menu/kitchen/MENU_AERIS_A4_2026_DIGITAL.pdf}
        bar-object-key: ${AERIS_MENU_BAR_OBJECT_KEY:content/aeris/menu/bar/BAR_CARD.pdf}
        elements-object-key: ${AERIS_MENU_ELEMENTS_OBJECT_KEY:content/aeris/menu/elements/ELEMENTS_CARD.pdf}
        wine-object-key: ${AERIS_MENU_WINE_OBJECT_KEY:content/aeris/menu/wine/WINE_MENU_2026_FINAL.pdf}
        rag-source: ${AERIS_MENU_RAG_SOURCE:media_assets:AERIS_MENU_*}
      floor-plan-object-key: ${AERIS_FLOOR_PLAN_OBJECT_KEY:content/aeris/floor-plan/AERIS_PLAN.pdf}
      interior-video-object-key: ${AERIS_INTERIOR_VIDEO_OBJECT_KEY:content/aeris/interior/INTERIOR.mp4}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      media-bucket: ${S3_BUCKET_MEDIA:astor-media}
      documents-bucket: ${S3_BUCKET_DOCUMENTS:astor-documents}
      ephemeral-prefix: ${S3_EPHEMERAL_PREFIX:transient}
      voice-prefix: ${S3_VOICE_PREFIX:telegram-voice}
      voice-ttl-days: ${S3_VOICE_TTL_DAYS:3}
  message:
    log-conversations-enabled: ${ASTOR_LOG_CONVERSATIONS_ENABLED:true}
  business-lunch:
    enabled: ${ASTOR_BUSINESS_LUNCH_ENABLED:true}
    default-venue-code: ${ASTOR_BUSINESS_LUNCH_VENUE:AERIS}
  shift:
    briefing:
      # Twice a day into the analytics chat: the plan in the first minutes of the shift, the look back once it is over.
      # Off by default; turning it on is a separate step from deploying it.
      enabled: ${ASTOR_SHIFT_BRIEFING_ENABLED:false}
      venue-code: ${ASTOR_SHIFT_BRIEFING_VENUE_CODE:AERIS}
      timezone: ${ASTOR_SHIFT_BRIEFING_TIMEZONE:Asia/Yekaterinburg}
      morning-cron: ${ASTOR_SHIFT_BRIEFING_MORNING_CRON:0 5 10 * * *}
      evening-cron: ${ASTOR_SHIFT_BRIEFING_EVENING_CRON:0 30 23 * * *}
  glasses:
    # The isolated glasses runtime repeats a staff question, Astor's answer and the photo of that request
    # to Butler, which puts them in the system chat and the shift feed. Off by default; both services need
    # the same token in their own environment.
    transcript-relay-enabled: ${ASTOR_GLASSES_TRANSCRIPT_RELAY_ENABLED:false}
    transcript-relay-url: ${ASTOR_GLASSES_TRANSCRIPT_RELAY_URL:http://aeris-astor-butler-bot:8089/api/internal/glasses/transcript}
    transcript-relay-photos: ${ASTOR_GLASSES_TRANSCRIPT_RELAY_PHOTOS:true}
    relay-token: ${ASTOR_GLASSES_RELAY_TOKEN:}
  booking:
    # HOSTESS: the hostess button in Telegram confirms. VENUE_SYSTEM: a booking that is in Presto is confirmed only
    # there (read back by the external sync); the hostess can still reject. Orders Presto does not know stay with the hostess.
    confirmation-source: ${ASTOR_BOOKING_CONFIRMATION_SOURCE:HOSTESS}
    external-sync:
      # Reads bookings back from the venue's own system (Saby) and confirms/cancels local orders accordingly.
      # Runs only while a provider is enabled and configured; 0 is not supported, set a large value to slow it down.
      fixed-delay-ms: ${ASTOR_EXTERNAL_SYNC_DELAY_MS:60000}
      initial-delay-ms: ${ASTOR_EXTERNAL_SYNC_INITIAL_DELAY_MS:90000}
  integrations:
    saby:
      enabled: ${ASTOR_SABY_ENABLED:false}
      write-enabled: ${SABY_WRITE_ENABLED:false}
      payment-enabled: ${SABY_PAYMENT_ENABLED:false}
      base-url: ${SABY_API_BASE_URL:https://api.sbis.ru}
      auth-url: ${SABY_AUTH_URL:https://online.sbis.ru/oauth/service/}
      app-client-id: ${SABY_APP_CLIENT_ID:}
      app-secret: ${SABY_APP_SECRET:}
      secret-key: ${SABY_SECRET_KEY:}
      point-id: ${SABY_POINT_ID:}
      hall-id: ${SABY_HALL_ID:}
      price-list-id: ${SABY_PRICE_LIST_ID:}
      venue-code: ${SABY_VENUE_CODE:AERIS}
      zone-id: ${SABY_ZONE_ID:Asia/Yekaterinburg}
      timeout-ms: ${SABY_TIMEOUT_MS:3000}
      max-retries: ${SABY_MAX_RETRIES:1}
  billing:
    # Butler never takes the money. On: a bill and its journal are kept for every order Butler places.
    enabled: ${ASTOR_BILLING_ENABLED:false}
    # On: every HTTP call to Saby is journalled (method, path, status, duration; no bodies, tokens or guest data).
    saby-call-log-enabled: ${ASTOR_SABY_CALL_LOG_ENABLED:false}
    # How often confirmed bookings are checked for a payment link to hand the guest, and how long after the visit the review is asked.
    payment-prompt-delay-ms: ${ASTOR_BILLING_PAYMENT_PROMPT_DELAY_MS:30000}
    review-delay-minutes: ${ASTOR_BILLING_REVIEW_DELAY_MINUTES:60}
    review-lookback-hours: ${ASTOR_BILLING_REVIEW_LOOKBACK_HOURS:24}
  startup:
    admin-notification-enabled: ${ASTOR_STARTUP_ADMIN_NOTIFICATION_ENABLED:true}
    operational-preview-enabled: ${ASTOR_OPERATIONAL_PREVIEW_ENABLED:true}
  speech-to-text:
    enabled: ${ASTOR_STT_ENABLED:false}
    command: ${ASTOR_STT_COMMAND:}
    work-dir: ${ASTOR_STT_WORK_DIR:/private/tmp/astor-butler-stt}
    timeout-seconds: ${ASTOR_STT_TIMEOUT_SECONDS:30}
    retry-ttl-seconds: ${ASTOR_STT_RETRY_TTL_SECONDS:1800}
    keep-local-files: ${ASTOR_STT_KEEP_LOCAL_FILES:false}
  semantic-memory:
    pgvector:
      enabled: ${ASTOR_SEMANTIC_PGVECTOR_ENABLED:true}
      embedding-dimension: ${ASTOR_SEMANTIC_EMBEDDING_DIMENSION:1536}
      default-model: ${ASTOR_SEMANTIC_EMBEDDING_MODEL:text-embedding-3-small}
    embeddings:
      provider: ${ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER:none}
      model: ${ASTOR_SEMANTIC_EMBEDDING_MODEL:text-search-doc/latest}
      query-model: ${ASTOR_SEMANTIC_QUERY_EMBEDDING_MODEL:text-search-query/latest}
      throttle-ms: ${ASTOR_SEMANTIC_EMBEDDINGS_THROTTLE_MS:0}
      ollama-base-url: ${ASTOR_SEMANTIC_OLLAMA_BASE_URL:${LLM_OLLAMA_BASE_URL:http://localhost:11434}}
    intent-examples:
      ingest-golden-corpus-on-startup: ${ASTOR_INTENT_EXAMPLES_INGEST_ON_STARTUP:false}
      golden-corpus: ${ASTOR_INTENT_EXAMPLES_GOLDEN_CORPUS:classpath:understanding/guest-input-golden-corpus.jsonl}
    chunks:
      ingest-on-startup: ${ASTOR_SEMANTIC_CHUNKS_INGEST_ON_STARTUP:false}
      seed-location: ${ASTOR_SEMANTIC_CHUNKS_SEED_LOCATION:classpath*:semantic/**/*.md}
  scenario-replies:
    llm:
      enabled: ${ASTOR_SCENARIO_REPLY_LLM_ENABLED:false}
      max-rag-chars: ${ASTOR_SCENARIO_REPLY_MAX_RAG_CHARS:900}
      timeout-ms: ${ASTOR_SCENARIO_REPLY_LLM_TIMEOUT_MS:6500}
  understanding:
    llm:
      enabled: ${ASTOR_UNDERSTANDING_LLM_ENABLED:false}
      min-confidence: ${ASTOR_UNDERSTANDING_LLM_MIN_CONFIDENCE:0.70}
      timeout-ms: ${ASTOR_UNDERSTANDING_LLM_TIMEOUT_MS:6500}
  nlu:
    duckling:
      enabled: ${ASTOR_NLU_DUCKLING_ENABLED:false}
      url: ${ASTOR_NLU_DUCKLING_URL:http://localhost:8000/parse}
      locale: ${ASTOR_NLU_DUCKLING_LOCALE:ru_RU}
      timezone: ${ASTOR_NLU_DUCKLING_TIMEZONE:Asia/Yekaterinburg}
      timeout-ms: ${ASTOR_NLU_DUCKLING_TIMEOUT_MS:500}
    natasha:
      enabled: ${ASTOR_NLU_NATASHA_ENABLED:false}
      url: ${ASTOR_NLU_NATASHA_URL:http://localhost:8011/analyze}
      timeout-ms: ${ASTOR_NLU_NATASHA_TIMEOUT_MS:500}
  timeline:
    scylla:
      enabled: ${ASTOR_TIMELINE_SCYLLA_ENABLED:false}
      host: ${ASTOR_TIMELINE_SCYLLA_HOST:localhost}
      port: ${ASTOR_TIMELINE_SCYLLA_PORT:9042}
      datacenter: ${ASTOR_TIMELINE_SCYLLA_DATACENTER:datacenter1}
      keyspace: ${ASTOR_TIMELINE_SCYLLA_KEYSPACE:astor_timeline}
      table: ${ASTOR_TIMELINE_SCYLLA_TABLE:guest_fsm_timeline_by_guest}
      schema-timeout-seconds: ${ASTOR_TIMELINE_SCYLLA_SCHEMA_TIMEOUT_SECONDS:30}
  graph-memory:
    neo4j:
      enabled: ${ASTOR_GRAPH_NEO4J_ENABLED:false}
      uri: ${ASTOR_GRAPH_NEO4J_URI:bolt://localhost:7687}
      username: ${ASTOR_GRAPH_NEO4J_USERNAME:neo4j}
      password: ${ASTOR_GRAPH_NEO4J_PASSWORD:astor_graph_password}
  content:
    telegram:
      public-channel:
        enabled: ${ASTOR_AERIS_CHANNEL_INGEST_ENABLED:true}
        scheduled-enabled: ${ASTOR_AERIS_CHANNEL_INGEST_SCHEDULED_ENABLED:true}
        fixed-delay-ms: ${ASTOR_AERIS_CHANNEL_INGEST_FIXED_DELAY_MS:3600000}
        timeout-seconds: ${ASTOR_AERIS_CHANNEL_INGEST_TIMEOUT_SECONDS:8}
        asset-mirroring-enabled: ${ASTOR_AERIS_CHANNEL_ASSET_MIRRORING_ENABLED:true}
        asset-timeout-seconds: ${ASTOR_AERIS_CHANNEL_ASSET_TIMEOUT_SECONDS:12}
        asset-max-bytes: ${ASTOR_AERIS_CHANNEL_ASSET_MAX_BYTES:25000000}
        venue-code: ${ASTOR_AERIS_CHANNEL_VENUE_CODE:AERIS}
        username: ${ASTOR_AERIS_CHANNEL_USERNAME:aeris_gastrobar}
        url: ${ASTOR_AERIS_CHANNEL_URL:https://t.me/s/aeris_gastrobar}
  web:
    notifications:
      admin-chat-enabled: ${ASTOR_WEB_ADMIN_CHAT_NOTIFICATIONS_ENABLED:true}
    rate-limit:
      enabled: ${ASTOR_WEB_RATE_LIMIT_ENABLED:true}
      max-per-minute: ${ASTOR_WEB_RATE_LIMIT_MAX_PER_MINUTE:12}
      burst-window-seconds: ${ASTOR_WEB_RATE_LIMIT_BURST_WINDOW_SECONDS:10}
      max-burst: ${ASTOR_WEB_RATE_LIMIT_MAX_BURST:4}

spring:
  application:
    name: astor-butler

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mongodb:
      uri: ${MONGODB_URI}

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    change-log: ${SPRING_LIQUIBASE_CHANGE_LOG:classpath:/db/changelog/changelog-master.yaml}
    enabled: true

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:astor_butler_bot}
    get-updates-timeout-seconds: ${TELEGRAM_GET_UPDATES_TIMEOUT_SECONDS:20}
    proxy:
      type: ${TELEGRAM_PROXY_TYPE:NO_PROXY}
      host: ${TELEGRAM_PROXY_HOST:}
      port: ${TELEGRAM_PROXY_PORT:0}
  ui:
    preview-enabled: ${TELEGRAM_UI_PREVIEW_ENABLED:true}
    cleanup-enabled: ${TELEGRAM_UI_CLEANUP_ENABLED:false}
    delete-user-messages-enabled: ${TELEGRAM_UI_DELETE_USER_MESSAGES_ENABLED:false}
    preview-version: ${TELEGRAM_UI_PREVIEW_VERSION:2026-07-01-system-trace-preview}
    preview-avatar-path: ${TELEGRAM_UI_PREVIEW_AVATAR_PATH:classpath:telegram/aeris-butler-preview.png}
  voice:
    download-enabled: ${TELEGRAM_VOICE_DOWNLOAD_ENABLED:true}
    enrichment-timeout-ms: ${TELEGRAM_VOICE_ENRICHMENT_TIMEOUT_MS:20000}
    download-timeout-ms: ${TELEGRAM_VOICE_DOWNLOAD_TIMEOUT_MS:15000}
    max-duration-seconds: ${TELEGRAM_VOICE_MAX_DURATION_SECONDS:60}
    max-file-size-bytes: ${TELEGRAM_VOICE_MAX_FILE_SIZE_BYTES:10485760}
  admin:
    chat-id: ${TELEGRAM_ADMIN_CHAT_ID:}
  analytics:
    chat-id: ${TELEGRAM_ANALYTICS_CHAT_ID:${TELEGRAM_ADMIN_CHAT_ID:}}
    min-send-interval-ms: ${TELEGRAM_ANALYTICS_MIN_SEND_INTERVAL_MS:3200}
    max-retries: ${TELEGRAM_ANALYTICS_MAX_RETRIES:2}
  system:
    chat-id: ${TELEGRAM_SYSTEM_CHAT_ID:}
    notifications-enabled: ${TELEGRAM_SYSTEM_NOTIFICATIONS_ENABLED:false}
  ops:
    chat-id: ${TELEGRAM_OPS_CHAT_ID:${TELEGRAM_HOSTESS_CHAT_ID:}}
    group-qa:
      enabled: ${TELEGRAM_OPS_GROUP_QA_ENABLED:false}
      llm-enabled: ${TELEGRAM_OPS_GROUP_QA_LLM_ENABLED:true}
    group-intake:
      enabled: ${TELEGRAM_OPS_GROUP_INTAKE_ENABLED:false}
      ack-enabled: ${TELEGRAM_OPS_GROUP_INTAKE_ACK_ENABLED:true}
    owner-mention: ${TELEGRAM_OPS_OWNER_MENTION:@michaelwelly}
    owner-username: ${TELEGRAM_OPS_OWNER_USERNAME:michaelwelly}
    owner-user-id: ${TELEGRAM_OPS_OWNER_USER_ID:}
  booking:
    notifications-enabled: ${TELEGRAM_BOOKING_NOTIFICATIONS_ENABLED:true}
    manager-chat-id: ${TELEGRAM_BOOKING_MANAGER_CHAT_ID:876857557}
    hostess-chat-id: ${TELEGRAM_HOSTESS_CHAT_ID:}
    plan-pdf-asset-code: ${TELEGRAM_BOOKING_PLAN_PDF_ASSET_CODE:AERIS_FLOOR_PLAN}
  quiet-guide:
    interior-video-asset-code: ${TELEGRAM_QUIET_GUIDE_INTERIOR_VIDEO_ASSET_CODE:AERIS_INTERIOR_TOUR}
  oauth:
    client-id: ${TELEGRAM_CLIENT_ID:}
    redirect-uri: ${TELEGRAM_REDIRECT_URI:http://localhost:8080/auth/telegram/callback}

llm:
  ollama:
    base-url: ${LLM_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${LLM_OLLAMA_MODEL:${LLM_OLLAMA_FRONTLINE_MODEL:qwen2.5:1.5b}}
    frontline-model: ${LLM_OLLAMA_FRONTLINE_MODEL:${LLM_OLLAMA_MODEL:qwen2.5:1.5b}}
    quality-model: ${LLM_OLLAMA_QUALITY_MODEL:qwen2.5:3b}
    vision-model: ${LLM_OLLAMA_VISION_MODEL:qwen2.5vl:3b}
    keep-alive: ${LLM_OLLAMA_KEEP_ALIVE:30m}
    warmup-enabled: ${LLM_WARMUP_ENABLED:true}
    warmup-interval-seconds: ${LLM_WARMUP_INTERVAL_SECONDS:120}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:8000}

yandex:
  ai:
    base-url: ${YANDEX_AI_BASE_URL:https://llm.api.cloud.yandex.net}
    responses-base-url: ${YANDEX_RESPONSES_BASE_URL:https://ai.api.cloud.yandex.net/v1}
    agent-endpoint: ${YANDEX_AGENT_ENDPOINT:https://ai.api.cloud.yandex.net/v1/agents/fvt51f9cslgi648vvg35:execute}
    agent-id: ${YANDEX_AGENT_ID:fvt18kmmnas336paia3g}
    agent-model: ${YANDEX_AGENT_MODEL:${YANDEX_MODEL:yandexgpt-5-lite}}
    folder-id: ${YANDEX_FOLDER_ID:}
    api-key: ${YANDEX_API_KEY:}
    iam-token: ${YANDEX_IAM_TOKEN:}
    model: ${YANDEX_MODEL:yandexgpt-5-lite}
    quality-model: ${YANDEX_QUALITY_MODEL:yandexgpt-5.1}
    timeout-ms: ${YANDEX_TIMEOUT_MS:8000}
    max-tokens: ${YANDEX_MAX_TOKENS:256}
    temperature: ${YANDEX_TEMPERATURE:0.1}
    embedding-max-attempts: ${YANDEX_EMBEDDING_MAX_ATTEMPTS:6}
    embedding-retry-delay-ms: ${YANDEX_EMBEDDING_RETRY_DELAY_MS:5000}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    cassandra:
      enabled: false
    neo4j:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.apache.kafka: WARN
