# Guest-facing texts, Russian: the source of truth for every other language.
#
# Rules (checked by GuestCatalogConsistencyTest):
# - every key here exists in en.yaml with the same {placeholders};
# - values are double-quoted; multi-line texts use "|-" so they do not gain a trailing newline;
# - staff texts (hostess, managers, ops chats) do not belong here: staff work in Russian.
