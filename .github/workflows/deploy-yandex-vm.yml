name: Deploy to Yandex VM
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only preflight or AERIS-only deployment"
        type: choice
        options: [preflight, deploy]
        default: preflight
      backup_path:
        description: "Deploy: absolute path of operator-verified fresh DB backup on VM"
        required: false
      confirm:
        description: "Deploy: DEPLOY_AERIS after agreeing maintenance/rollback window"
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: astor-yandex-vm
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and CI
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git ls-files '.env' '.env.*' 'target/**' '.codex*')"
          if [ "$MODE" = deploy ]; then
            test "$CONFIRM" = DEPLOY_AERIS
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" \
              --jq '.workflow_runs | length' | awk '$1 > 0 {ok=1} END {exit !ok}'
          fi
          bash -n scripts/deploy/aeris-scoped.sh
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.YANDEX_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
          VM_PORT: ${{ secrets.YANDEX_VM_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/yandex_vm_key
          chmod 600 ~/.ssh/yandex_vm_key
          ssh-keyscan -p "${VM_PORT:-22}" "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Preflight and optional scoped deployment
        env:
          VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
          VM_USER: ${{ secrets.YANDEX_VM_USER }}
          VM_PORT: ${{ secrets.YANDEX_VM_SSH_PORT }}
          VM_PATH: ${{ secrets.YANDEX_VM_DEPLOY_PATH }}
          MODE: ${{ inputs.mode }}
          BACKUP_PATH: ${{ inputs.backup_path }}
        run: |
          set -euo pipefail
          deploy_path="${VM_PATH:-/opt/astor-butler}"
          [[ "$deploy_path" =~ ^/[a-zA-Z0-9_./-]+$ && "$deploy_path" != / ]]
          [[ -z "$BACKUP_PATH" || "$BACKUP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          ssh_args=(-i ~/.ssh/yandex_vm_key -p "${VM_PORT:-22}" -o BatchMode=yes)
          remote="$VM_USER@$VM_HOST"
          ssh "${ssh_args[@]}" "$remote" "bash -s -- '$deploy_path' preflight '$GITHUB_SHA' ''" < scripts/deploy/aeris-scoped.sh
          if [ "$MODE" = deploy ]; then
            release="$deploy_path/releases/$GITHUB_SHA"
            ssh "${ssh_args[@]}" "$remote" "mkdir -p '$release'"
            rsync -az --exclude '.git/' --exclude '.env*' --exclude 'target/' --exclude '.codex*' \
              -e "ssh -i ~/.ssh/yandex_vm_key -p ${VM_PORT:-22} -o BatchMode=yes" ./ "$remote:$release/"
            ssh "${ssh_args[@]}" "$remote" "bash -s -- '$deploy_path' deploy '$GITHUB_SHA' '$BACKUP_PATH'" < scripts/deploy/aeris-scoped.sh
          fi
