name: CI

on:
  pull_request:
  push:
    branches:
      - main

# PR branches are validated by pull_request, avoiding a second identical push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      staff-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: staff_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASTOR_STAFF_TEST_JDBC: jdbc:postgresql://127.0.0.1:5432/staff_portal_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify scoped deployment guards
        run: |
          bash scripts/deploy/test-aeris-scoped.sh
          bash scripts/deploy/test-cloudru-deploy.sh

      - name: Verify Cloud.ru backup failure and permission guards
        run: |
          bash -n infra/cloudru/host/astor-backup.sh
          python3 -m unittest discover -s infra/cloudru/host/tests -v

      - name: Guard tracked secrets and artifacts
        run: |
          set -euo pipefail
          tracked="$(git ls-files '.env' '.env.*' 'target/**' '.codex*' || true)"
          if [ -n "$tracked" ]; then
            echo "Forbidden tracked files detected:"
            echo "$tracked"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee /tmp/maven-test.log
      # The job log and the run summary live where some environments cannot read them; annotations are
      # served by the API, so a failure says what broke without anyone having to open the web page.
      - name: Annotate Maven errors
        if: failure()
        run: |
          {
            grep -E '^\[ERROR\]' /tmp/maven-test.log | head -12 || true
            grep -rhE 'Tests run:.*(Failures: [1-9]|Errors: [1-9])' target/surefire-reports 2>/dev/null | head -5 || true
          } | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
          done
          echo '--- captured errors above; full log is in the job output ---'

      - name: Set up Node for staff auth checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Staff frontend auth and asset checks
        run: node --test frontend/astor-butler/tests/*.test.mjs

      - name: Astor identity manifest and proxy boundaries
        run: |
          node --test docker/keycloak/tests/*.test.mjs
          bash -n docker/keycloak/entrypoint.sh docker/keycloak/prepare-runtime.sh

      - name: Package
        run: mvn -B -DskipTests package

      - name: Build Docker image
        run: docker build -t astor-butler-mvp:ci .

  concierge-ratings:
    name: Concierge ratings tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ratings snapshot and feed ranking tests
        run: node --test scripts/concierge_ratings/test/*.test.mjs

      - name: AERIS menu sync tests
        run: node --test scripts/aeris_menu/test/*.test.mjs

      - name: Saby stub tests
        run: node --test scripts/saby_stub/test/*.test.mjs

  android-glasses:
    name: Android glasses client rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Rules and server contract tests
        working-directory: clients/android-glasses
        run: ./gradlew :core:test --no-daemon
