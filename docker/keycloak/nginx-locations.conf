# Insert ONLY into the existing c3ag.ru HTTPS server; keep other locations intact.
# The gateway must join astor-identity_proxy; never expose admin/master publicly.
location = /astor-auth { return 404; }
location ^~ /astor-auth/realms/astor/ {
    # Explicit trusted proxy values: incoming forwarding headers never define issuer/IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $astor_identity_upstream http://astor-identity-keycloak:8080;
    proxy_pass $astor_identity_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host c3ag.ru;
    proxy_set_header X-Forwarded-Host c3ag.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Original-Forwarded-For "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Original-Method "";
    proxy_set_header X-Forwarded-Access-Token "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
    limit_req zone=api_limit burst=20 nodelay;
    # OAuth code/state and credentials must not enter query/body logs or caches.
    access_log off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /astor-auth/resources/ {
    # Explicit trusted proxy values: incoming forwarding headers never define issuer/IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $astor_identity_upstream http://astor-identity-keycloak:8080;
    proxy_pass $astor_identity_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host c3ag.ru;
    proxy_set_header X-Forwarded-Host c3ag.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Original-Forwarded-For "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Original-Method "";
    proxy_set_header X-Forwarded-Access-Token "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
    limit_req zone=api_limit burst=20 nodelay;
    # OAuth code/state and credentials must not enter query/body logs or caches.
    access_log off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /astor-auth/ { return 404; }
