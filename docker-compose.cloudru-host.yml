# Cloud.ru host override (untracked). MinIO images are no longer downloadable (Docker Hub repo removed,
# quay tags differ, dl.min.io returns 410), so the S3 role is played by RustFS (MinIO-compatible API)
# and buckets are created with aws-cli instead of mc.
services:
  minio:
    image: rustfs/rustfs:latest
    command: []
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-astor}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-astor_minio_password}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-astor}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-astor_minio_password}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/live >/dev/null || curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ | grep -qE '^(200|403)$'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
  minio-init:
    image: amazon/aws-cli:2.22.35
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-astor}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-astor_minio_password}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: >
      sh -c 'for b in "$$S3_BUCKET_MEDIA" "$$S3_BUCKET_DOCUMENTS"; do
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$b" 2>/dev/null || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$b"; done && echo buckets-ready'
