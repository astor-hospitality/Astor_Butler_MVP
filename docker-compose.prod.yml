services:
  api-gateway:
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PUBLIC_PORT:-80}:8080"

  c3-agency-frontend:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_SITE_URL: ${C3_FRONTEND_PUBLIC_URL:-http://51.250.31.97:3001}
        NEXT_PUBLIC_API_BASE_URL: ${C3_FRONTEND_API_BASE_URL:-http://51.250.31.97:8089}
        NEXT_PUBLIC_WEB_CHAT_ENDPOINT: ${C3_FRONTEND_WEB_CHAT_ENDPOINT:-http://51.250.31.97:8089/api/messages}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${C3_FRONTEND_MEDIA_BASE_URL:-https://storage.yandexcloud.net/c3ag-media}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${C3_FRONTEND_BRAND_LOGO_URL:-https://storage.yandexcloud.net/c3ag-media/brand/c3ag-logo.svg}
        NEXT_PUBLIC_CLIO_VOICE_ENABLED: ${C3_FRONTEND_CLIO_VOICE_ENABLED:-false}
        NEXT_PUBLIC_CLIO_TTS_ENABLED: ${C3_FRONTEND_CLIO_TTS_ENABLED:-false}
        NEXT_PUBLIC_CLIO_VOICE_TRANSCRIBE_ENDPOINT: ${C3_FRONTEND_CLIO_VOICE_TRANSCRIBE_ENDPOINT:-/api/chat/transcribe}
        NEXT_PUBLIC_CLIO_TTS_ENDPOINT: ${C3_FRONTEND_CLIO_TTS_ENDPOINT:-/api/chat/speak}
        NEXT_PUBLIC_CLIO_TELEGRAM_HANDOFF_ENABLED: ${C3_FRONTEND_CLIO_TELEGRAM_HANDOFF_ENABLED:-false}
        NEXT_PUBLIC_CLIO_TELEGRAM_BOT_USERNAME: ${C3_FRONTEND_CLIO_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_PRODUCT_CARD_SLIDES_AUTOPLAY: ${C3_FRONTEND_PRODUCT_CARD_SLIDES_AUTOPLAY:-false}
    ports:
      - "${C3_FRONTEND_PUBLIC_PORT:-3001}:3001"

  aeris-astor-butler-bot:
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Shared secret for the non-public API (/api/bookings, /api/fsm, /api/admin, /api/internal, /api/concierge,
      # /actuator; /api/messages for channels other than WEB). Blank = those paths answer 401 (fail closed).
      # The same value goes into the Concierge .env (header X-Astor-Internal-Token). docs/operations/PUBLIC_API_GUARD.md
      ASTOR_INTERNAL_API_TOKEN: ${ASTOR_INTERNAL_API_TOKEN:-}
      ASTOR_MODEL_PROVIDER: ${ASTOR_MODEL_PROVIDER:-yandex}
      # Sber: ASTOR_MODEL_PROVIDER=cloudru (Cloud.ru Foundation Models) or gigachat (GigaChat API direct).
      # docs/operations/SBER_AI_ACTIVATION.md
      CLOUDRU_BASE_URL: ${CLOUDRU_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      CLOUDRU_MODEL: ${CLOUDRU_MODEL:-}
      CLOUDRU_QUALITY_MODEL: ${CLOUDRU_QUALITY_MODEL:-}
      CLOUDRU_VISION_MODEL: ${CLOUDRU_VISION_MODEL:-}
      CLOUDRU_EMBEDDING_MODEL: ${CLOUDRU_EMBEDDING_MODEL:-}
      CLOUDRU_TIMEOUT_MS: ${CLOUDRU_TIMEOUT_MS:-15000}
      CLOUDRU_MAX_TOKENS: ${CLOUDRU_MAX_TOKENS:-256}
      CLOUDRU_TEMPERATURE: ${CLOUDRU_TEMPERATURE:-0.1}
      CLOUDRU_JSON_MODE: ${CLOUDRU_JSON_MODE:-true}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_QUALITY_MODEL: ${GIGACHAT_QUALITY_MODEL:-}
      GIGACHAT_VISION_MODEL: ${GIGACHAT_VISION_MODEL:-}
      GIGACHAT_EMBEDDING_MODEL: ${GIGACHAT_EMBEDDING_MODEL:-Embeddings}
      GIGACHAT_CA_CERT_PATH: ${GIGACHAT_CA_CERT_PATH:-}
      GIGACHAT_TIMEOUT_MS: ${GIGACHAT_TIMEOUT_MS:-15000}
      GIGACHAT_MAX_TOKENS: ${GIGACHAT_MAX_TOKENS:-256}
      GIGACHAT_TEMPERATURE: ${GIGACHAT_TEMPERATURE:-0.1}
      # Server voice: ASTOR_TTS_PROVIDER=salute (Sber SaluteSpeech) or yandex (SpeechKit, YANDEX_SPEECHKIT_*).
      # docs/operations/SBER_AI_ACTIVATION.md, section "TTS через SaluteSpeech".
      ASTOR_TTS_PROVIDER: ${ASTOR_TTS_PROVIDER:-salute}
      ASTOR_TTS_WEB_ENABLED: ${ASTOR_TTS_WEB_ENABLED:-false}
      SALUTE_AUTH_KEY: ${SALUTE_AUTH_KEY:-}
      SALUTE_SCOPE: ${SALUTE_SCOPE:-SALUTE_SPEECH_PERS}
      SALUTE_TTS_VOICE: ${SALUTE_TTS_VOICE:-Nec_24000}
      SALUTE_TTS_FORMAT: ${SALUTE_TTS_FORMAT:-wav16}
      # Telegram voice replies (docs/operations/TELEGRAM_VOICE_REPLIES.md): off | on | auto; needs SALUTE_TTS_FORMAT=opus
      # (salute) or YANDEX_TTS_FORMAT=oggopus (yandex).
      ASTOR_TELEGRAM_VOICE_REPLIES: ${ASTOR_TELEGRAM_VOICE_REPLIES:-off}
      ASTOR_TELEGRAM_VOICE_TIMEOUT_MS: ${ASTOR_TELEGRAM_VOICE_TIMEOUT_MS:-8000}
      ASTOR_TELEGRAM_VOICE_SUMMARY_VIA_MODEL: ${ASTOR_TELEGRAM_VOICE_SUMMARY_VIA_MODEL:-true}
      SALUTE_CA_CERT_PATH: ${SALUTE_CA_CERT_PATH:-${GIGACHAT_CA_CERT_PATH:-}}
      SALUTE_OAUTH_URL: ${SALUTE_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      SALUTE_TTS_URL: ${SALUTE_TTS_URL:-https://smartspeech.sber.ru/rest/v1/text:synthesize}
      YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
      YANDEX_SPEECHKIT_FOLDER_ID: ${YANDEX_SPEECHKIT_FOLDER_ID:-}
      YANDEX_SPEECHKIT_TTS_VOICE: ${YANDEX_SPEECHKIT_TTS_VOICE:-alena}
      # mp3, or oggopus for Telegram voice replies with ASTOR_TTS_PROVIDER=yandex.
      YANDEX_TTS_FORMAT: ${YANDEX_TTS_FORMAT:-mp3}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_QUALITY_MODEL: ${OPENAI_COMPATIBLE_QUALITY_MODEL:-}
      OPENAI_COMPATIBLE_VISION_MODEL: ${OPENAI_COMPATIBLE_VISION_MODEL:-}
      OPENAI_COMPATIBLE_EMBEDDING_MODEL: ${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-}
      OPENAI_COMPATIBLE_TIMEOUT_MS: ${OPENAI_COMPATIBLE_TIMEOUT_MS:-15000}
      OPENAI_COMPATIBLE_MAX_TOKENS: ${OPENAI_COMPATIBLE_MAX_TOKENS:-256}
      OPENAI_COMPATIBLE_TEMPERATURE: ${OPENAI_COMPATIBLE_TEMPERATURE:-0.1}
      OPENAI_COMPATIBLE_JSON_MODE: ${OPENAI_COMPATIBLE_JSON_MODE:-true}
      ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER: ${ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER:-model-gateway}
      ASTOR_SEMANTIC_EMBEDDING_MODEL: ${ASTOR_SEMANTIC_EMBEDDING_MODEL:-text-search-doc/latest}
      ASTOR_SEMANTIC_QUERY_EMBEDDING_MODEL: ${ASTOR_SEMANTIC_QUERY_EMBEDDING_MODEL:-text-search-query/latest}
      # ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER=yandex: Yandex text-search embeddings (256), docs/operations/SBER_AI_ACTIVATION.md
      ASTOR_SEMANTIC_EMBEDDING_DIMENSION: ${ASTOR_SEMANTIC_EMBEDDING_DIMENSION:-1536}
      ASTOR_EMBEDDINGS_YANDEX_API_KEY: ${ASTOR_EMBEDDINGS_YANDEX_API_KEY:-}
      ASTOR_EMBEDDINGS_YANDEX_FOLDER_ID: ${ASTOR_EMBEDDINGS_YANDEX_FOLDER_ID:-}
      ASTOR_SEMANTIC_EMBEDDINGS_THROTTLE_MS: ${ASTOR_SEMANTIC_EMBEDDINGS_THROTTLE_MS:-1200}
      ASTOR_INTENT_EXAMPLES_INGEST_ON_STARTUP: ${AERIS_INTENT_EXAMPLES_INGEST_ON_STARTUP:-false}
      YANDEX_EMBEDDING_MAX_ATTEMPTS: ${YANDEX_EMBEDDING_MAX_ATTEMPTS:-6}
      YANDEX_EMBEDDING_RETRY_DELAY_MS: ${YANDEX_EMBEDDING_RETRY_DELAY_MS:-5000}
      ASTOR_GRAPH_NEO4J_ENABLED: ${ASTOR_GRAPH_NEO4J_ENABLED:-false}
      ASTOR_TIMELINE_SCYLLA_ENABLED: ${ASTOR_TIMELINE_SCYLLA_ENABLED:-false}
      ASTOR_STT_ENABLED: ${ASTOR_STT_ENABLED:-true}
      # Production STT: Cloud.ru whisper-large-v3 (no local ML on the VM). While Cloud.ru FM is unavailable:
      # ASTOR_STT_PROVIDER=yandex (SpeechKit, YANDEX_SPEECHKIT_API_KEY). Rollback: ASTOR_STT_PROVIDER=local with an
      # image built with STT_LOCAL_WHISPER=true. See docs/operations/SBER_AI_ACTIVATION.md.
      ASTOR_STT_PROVIDER: ${ASTOR_STT_PROVIDER:-cloudru}
      ASTOR_STT_CLOUDRU_MODEL: ${ASTOR_STT_CLOUDRU_MODEL:-openai/whisper-large-v3}
      ASTOR_STT_LANGUAGE: ${ASTOR_STT_LANGUAGE:-ru}
      ASTOR_STT_TIMEOUT_SECONDS: ${ASTOR_STT_TIMEOUT_SECONDS:-60}
      ASTOR_SABY_ENABLED: ${ASTOR_SABY_ENABLED:-false}
      SABY_WRITE_ENABLED: ${SABY_WRITE_ENABLED:-false}
      SABY_APP_CLIENT_ID: ${SABY_APP_CLIENT_ID:-}
      SABY_APP_SECRET: ${SABY_APP_SECRET:-}
      SABY_SECRET_KEY: ${SABY_SECRET_KEY:-}
      SABY_POINT_ID: ${SABY_POINT_ID:-}
      SABY_HALL_ID: ${SABY_HALL_ID:-}
      SABY_PRICE_LIST_ID: ${SABY_PRICE_LIST_ID:-}
      # Live Presto answered order/create slower than 3 s on 13.10 (TIMEOUT, booking state unknown); 10 s by default.
      SABY_TIMEOUT_MS: ${SABY_TIMEOUT_MS:-10000}
      SABY_PAYMENT_ENABLED: ${SABY_PAYMENT_ENABLED:-false}
      ASTOR_BILLING_ENABLED: ${ASTOR_BILLING_ENABLED:-false}
      ASTOR_SABY_CALL_LOG_ENABLED: ${ASTOR_SABY_CALL_LOG_ENABLED:-false}
      # Guest journey (docs/superpowers/specs/2026-10-13-guest-journey-design.md): visit ledger and guest message counter.
      ASTOR_GUEST_JOURNEY_ENABLED: ${ASTOR_GUEST_JOURNEY_ENABLED:-false}
      ASTOR_REPEAT_LUNCH_ENABLED: ${ASTOR_REPEAT_LUNCH_ENABLED:-false}
      ASTOR_USEFULNESS_POLICY_ENABLED: ${ASTOR_USEFULNESS_POLICY_ENABLED:-false}
      ASTOR_BUTLER_TALK_ENABLED: ${ASTOR_BUTLER_TALK_ENABLED:-false}
      ASTOR_RETURN_LOOP_ENABLED: ${ASTOR_RETURN_LOOP_ENABLED:-false}
      ASTOR_JOURNEY_WEEKLY_REPORT_ENABLED: ${ASTOR_JOURNEY_WEEKLY_REPORT_ENABLED:-false}
      ASTOR_SABY_CRM_MIRROR_ENABLED: ${ASTOR_SABY_CRM_MIRROR_ENABLED:-false}
      SABY_CRM_JOURNEY_REGULATION_ID: ${SABY_CRM_JOURNEY_REGULATION_ID:-}
      SABY_CRM_PHASE_DIRECTIONS: ${SABY_CRM_PHASE_DIRECTIONS:-}
      SABY_CRM_RESPONSIBLE_ID: ${SABY_CRM_RESPONSIBLE_ID:-}
      # Saby codes that mean «the guest is at the table» (#151), e.g. 50/1002; empty (default) — nothing is SEATED from Saby.
      ASTOR_SABY_SEATED_STATES: ${ASTOR_SABY_SEATED_STATES:-}
      ASTOR_BILLING_REVIEW_DELAY_MINUTES: ${ASTOR_BILLING_REVIEW_DELAY_MINUTES:-60}
      # Morning reconfirmation of today's bookings (#149): off by default; the venue clock is Asia/Yekaterinburg.
      ASTOR_BOOKING_MORNING_CHECK_ENABLED: ${AERIS_BOOKING_MORNING_CHECK_ENABLED:-${ASTOR_BOOKING_MORNING_CHECK_ENABLED:-false}}
      ASTOR_BOOKING_MORNING_CHECK_TIME: ${ASTOR_BOOKING_MORNING_CHECK_TIME:-10:30}
      ASTOR_BOOKING_MORNING_CHECK_MIN_LEAD_MINUTES: ${ASTOR_BOOKING_MORNING_CHECK_MIN_LEAD_MINUTES:-90}
      # after-close (default): the review after the venue closes the order / by the clock. on-bill: at the bill — with
      # the payment link, or by the hostess «Счёт» button on the reservation card. docs/integrations/SABY_BILLING.md §8
      ASTOR_REVIEW_MOMENT: ${ASTOR_REVIEW_MOMENT:-after-close}
      # The guest's own «счёт» in the bot (#153 A2): a card «стол N просит счёт» to the staff chat and, with on-bill, the review. Off by default.
      ASTOR_GUEST_BILL_REQUEST_ENABLED: ${AERIS_GUEST_BILL_REQUEST_ENABLED:-${ASTOR_GUEST_BILL_REQUEST_ENABLED:-false}}
      # Auto-confirm of the hostess card (#148, docs/fsm/FSM_SCENARIOS.md): off by default, nothing changes until enabled.
      # Unanswered cards go to TELEGRAM_BOOKING_MANAGER_CHAT_ID after the timeout in manual mode (/manual on) or for a large party.
      ASTOR_BOOKING_AUTO_CONFIRM_ENABLED: ${AERIS_BOOKING_AUTO_CONFIRM_ENABLED:-${ASTOR_BOOKING_AUTO_CONFIRM_ENABLED:-false}}
      ASTOR_BOOKING_AUTO_CONFIRM_TIMEOUT_MINUTES: ${AERIS_BOOKING_AUTO_CONFIRM_TIMEOUT_MINUTES:-${ASTOR_BOOKING_AUTO_CONFIRM_TIMEOUT_MINUTES:-7}}
      ASTOR_BOOKING_AUTO_CONFIRM_MAX_PARTY: ${AERIS_BOOKING_AUTO_CONFIRM_MAX_PARTY:-${ASTOR_BOOKING_AUTO_CONFIRM_MAX_PARTY:-6}}
      ASTOR_BOOKING_AUTO_CONFIRM_EXCLUDE_ZONES: ${AERIS_BOOKING_AUTO_CONFIRM_EXCLUDE_ZONES:-${ASTOR_BOOKING_AUTO_CONFIRM_EXCLUDE_ZONES:-VIP_ZONE}}
      TELEGRAM_BOOKING_MANAGER_CHAT_ID: ${AERIS_BOOKING_MANAGER_CHAT_ID:-${TELEGRAM_BOOKING_MANAGER_CHAT_ID:-876857557}}
      # Business lunch scenario switch (#134 fallback, BUSINESS_LUNCH_FIRST_TEST.md §6): on by default, as before.
      ASTOR_BUSINESS_LUNCH_ENABLED: ${AERIS_BUSINESS_LUNCH_ENABLED:-${ASTOR_BUSINESS_LUNCH_ENABLED:-true}}
      # Lunch wishes for the kitchen and the bar + dish composition from the menu file (#165). Off by default.
      ASTOR_LUNCH_WISHES_ENABLED: ${AERIS_LUNCH_WISHES_ENABLED:-${ASTOR_LUNCH_WISHES_ENABLED:-false}}
      # Kitchen mark on a lunch pre-order (#164): «ПРЕДЗАКАЗ: готовить ко времени HH:MM, гостей N» first in the Saby comment, «⏱ Готовить ко времени» on the hostess card. Off by default.
      ASTOR_LUNCH_PREORDER_MARK_ENABLED: ${AERIS_LUNCH_PREORDER_MARK_ENABLED:-${ASTOR_LUNCH_PREORDER_MARK_ENABLED:-false}}
      ASTOR_LUNCH_PREORDER_LEAD_MINUTES: ${AERIS_LUNCH_PREORDER_LEAD_MINUTES:-${ASTOR_LUNCH_PREORDER_LEAD_MINUTES:-0}}
      # Lunch scoreboard for the staff chat at 16:30 + /табло (#175). Off by default.
      ASTOR_LUNCH_SCOREBOARD_ENABLED: ${AERIS_LUNCH_SCOREBOARD_ENABLED:-${ASTOR_LUNCH_SCOREBOARD_ENABLED:-false}}
      ASTOR_LUNCH_SCOREBOARD_SEND_AT: ${ASTOR_LUNCH_SCOREBOARD_SEND_AT:-16:30}
      # Shift manager's kill switch (#134): /stop, /start_butler, /status_butler in the staff chat. Off by default.
      ASTOR_KILL_SWITCH_ENABLED: ${AERIS_KILL_SWITCH_ENABLED:-${ASTOR_KILL_SWITCH_ENABLED:-false}}
      # Tips to the waiter of the table (#161): /официант and /чаевые in the staff chat, the recipient by table. Off by default.
      ASTOR_TIPS_PERSONAL_ENABLED: ${AERIS_TIPS_PERSONAL_ENABLED:-${ASTOR_TIPS_PERSONAL_ENABLED:-false}}
      ASTOR_TIPS_PERSONAL_TENANT: ${ASTOR_TIPS_PERSONAL_TENANT:-AERIS}
      # Staff member's personal guest link / QR and the entry log (#128): /ссылка in the staff chat, «Привёл(а)» on the hostess card. Off by default.
      ASTOR_STAFF_HANDOFF_ENABLED: ${AERIS_STAFF_HANDOFF_ENABLED:-${ASTOR_STAFF_HANDOFF_ENABLED:-false}}
      ASTOR_STAFF_HANDOFF_TENANT: ${AERIS_STAFF_HANDOFF_TENANT:-${ASTOR_STAFF_HANDOFF_TENANT:-}}
      # Hostess edits a booking from its card (#150): «✏️ Изменить» → table / time / party size. Off by default.
      ASTOR_BOOKING_STAFF_EDIT_ENABLED: ${AERIS_BOOKING_STAFF_EDIT_ENABLED:-${ASTOR_BOOKING_STAFF_EDIT_ENABLED:-false}}
      # «🪑 Гость сел» on the confirmed hostess card (#151): off by default; the press makes the booking SEATED with the time.
      ASTOR_BOOKING_SEATED_ENABLED: ${AERIS_BOOKING_SEATED_ENABLED:-${ASTOR_BOOKING_SEATED_ENABLED:-false}}
      # Guest card for the waiter after «гость сел» (#163): wishes, remembered preferences, visits, favourites, under the hostess card. Off by default.
      ASTOR_WAITER_GUEST_CARD_ENABLED: ${AERIS_WAITER_GUEST_CARD_ENABLED:-${ASTOR_WAITER_GUEST_CARD_ENABLED:-false}}
      # Table hold expiry (#87): off by default. On, a request the hostess did not answer within the TTL becomes EXPIRED,
      # the table is released, the guest may pick another time, the card goes to TELEGRAM_BOOKING_MANAGER_CHAT_ID.
      ASTOR_BOOKING_HOLD_EXPIRY_ENABLED: ${AERIS_BOOKING_HOLD_EXPIRY_ENABLED:-${ASTOR_BOOKING_HOLD_EXPIRY_ENABLED:-false}}
      ASTOR_BOOKING_HOLD_TTL_MINUTES: ${AERIS_BOOKING_HOLD_TTL_MINUTES:-${ASTOR_BOOKING_HOLD_TTL_MINUTES:-15}}
      ASTOR_BOOKING_HOLD_EXPIRY_CHECK_SECONDS: ${ASTOR_BOOKING_HOLD_EXPIRY_CHECK_SECONDS:-60}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-true}
      TELEGRAM_GET_UPDATES_TIMEOUT_SECONDS: ${TELEGRAM_GET_UPDATES_TIMEOUT_SECONDS:-20}
      TELEGRAM_UI_CLEANUP_ENABLED: ${TELEGRAM_UI_CLEANUP_ENABLED:-false}
      TELEGRAM_UI_DELETE_USER_MESSAGES_ENABLED: ${TELEGRAM_UI_DELETE_USER_MESSAGES_ENABLED:-false}
      ASTOR_WEB_ALLOWED_ORIGINS: ${ASTOR_WEB_ALLOWED_ORIGINS:-http://51.250.31.97:3001}
      YANDEX_AI_BASE_URL: ${YANDEX_AI_BASE_URL:-https://llm.api.cloud.yandex.net}
      YANDEX_RESPONSES_BASE_URL: ${YANDEX_RESPONSES_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      YANDEX_AGENT_ID: ${YANDEX_AGENT_ID:-fvt18kmmnas336paia3g}
      YANDEX_AGENT_MODEL: ${YANDEX_AGENT_MODEL:-${YANDEX_MODEL:-yandexgpt-5-lite}}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:?set YANDEX_FOLDER_ID in .env.production}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_IAM_TOKEN: ${YANDEX_IAM_TOKEN:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-yandexgpt-5-lite}
      YANDEX_QUALITY_MODEL: ${YANDEX_QUALITY_MODEL:-yandexgpt-5.1}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
    ports:
      - "${AERIS_BOT_PUBLIC_PORT:-8089}:8089"

  c3flex-astor-butler-bot:
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Shared secret for the non-public API (/api/bookings, /api/fsm, /api/admin, /api/internal, /api/concierge,
      # /actuator; /api/messages for channels other than WEB). Blank = those paths answer 401 (fail closed).
      # The same value goes into the Concierge .env (header X-Astor-Internal-Token). docs/operations/PUBLIC_API_GUARD.md
      ASTOR_INTERNAL_API_TOKEN: ${ASTOR_INTERNAL_API_TOKEN:-}
      ASTOR_MODEL_PROVIDER: ${ASTOR_MODEL_PROVIDER:-yandex}
      # Sber: ASTOR_MODEL_PROVIDER=cloudru (Cloud.ru Foundation Models) or gigachat (GigaChat API direct).
      # docs/operations/SBER_AI_ACTIVATION.md
      CLOUDRU_BASE_URL: ${CLOUDRU_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      CLOUDRU_MODEL: ${CLOUDRU_MODEL:-}
      CLOUDRU_QUALITY_MODEL: ${CLOUDRU_QUALITY_MODEL:-}
      CLOUDRU_VISION_MODEL: ${CLOUDRU_VISION_MODEL:-}
      CLOUDRU_EMBEDDING_MODEL: ${CLOUDRU_EMBEDDING_MODEL:-}
      CLOUDRU_TIMEOUT_MS: ${CLOUDRU_TIMEOUT_MS:-15000}
      CLOUDRU_MAX_TOKENS: ${CLOUDRU_MAX_TOKENS:-256}
      CLOUDRU_TEMPERATURE: ${CLOUDRU_TEMPERATURE:-0.1}
      CLOUDRU_JSON_MODE: ${CLOUDRU_JSON_MODE:-true}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_QUALITY_MODEL: ${GIGACHAT_QUALITY_MODEL:-}
      GIGACHAT_VISION_MODEL: ${GIGACHAT_VISION_MODEL:-}
      GIGACHAT_EMBEDDING_MODEL: ${GIGACHAT_EMBEDDING_MODEL:-Embeddings}
      GIGACHAT_CA_CERT_PATH: ${GIGACHAT_CA_CERT_PATH:-}
      GIGACHAT_TIMEOUT_MS: ${GIGACHAT_TIMEOUT_MS:-15000}
      GIGACHAT_MAX_TOKENS: ${GIGACHAT_MAX_TOKENS:-256}
      GIGACHAT_TEMPERATURE: ${GIGACHAT_TEMPERATURE:-0.1}
      # Server voice: ASTOR_TTS_PROVIDER=salute (Sber SaluteSpeech) or yandex (SpeechKit, YANDEX_SPEECHKIT_*).
      # docs/operations/SBER_AI_ACTIVATION.md, section "TTS через SaluteSpeech".
      ASTOR_TTS_PROVIDER: ${ASTOR_TTS_PROVIDER:-salute}
      ASTOR_TTS_WEB_ENABLED: ${ASTOR_TTS_WEB_ENABLED:-false}
      SALUTE_AUTH_KEY: ${SALUTE_AUTH_KEY:-}
      SALUTE_SCOPE: ${SALUTE_SCOPE:-SALUTE_SPEECH_PERS}
      SALUTE_TTS_VOICE: ${SALUTE_TTS_VOICE:-Nec_24000}
      SALUTE_TTS_FORMAT: ${SALUTE_TTS_FORMAT:-wav16}
