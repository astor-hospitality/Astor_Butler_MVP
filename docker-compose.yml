      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/actuator/health >/dev/null"]
      interval: 45s
      timeout: 5s
      retries: 20
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: astor_postgres_test
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_CPUS:-0.75}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astor_butler_test}
      POSTGRES_USER: ${POSTGRES_USER:-astor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 10

  scylla:
    image: scylladb/scylla:6.2
    container_name: astor_scylla_timeline
    mem_limit: ${SCYLLA_MEMORY_LIMIT:-1g}
    cpus: ${SCYLLA_CPUS:-1.0}
    command:
      - --smp
      - "1"
      - --memory
      - ${SCYLLA_ENGINE_MEMORY:-384M}
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
    ports:
      - "${SCYLLA_CQL_PORT:-9042}:9042"
    volumes:
      - scylladata:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh $$(hostname -i | cut -d' ' -f1) 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 20
      start_period: 60s

  neo4j:
    image: neo4j:5.22-community
    container_name: astor_neo4j_graph
    mem_limit: ${NEO4J_MEMORY_LIMIT:-1g}
    cpus: ${NEO4J_CPUS:-1.0}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-astor_graph_password}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 20
      start_period: 45s

  redis:
    image: redis:7.2
    container_name: astor_redis_test
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    entrypoint: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 30s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: astor_mongo_test
    command: ["mongod", "--quiet", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "${MONGO_WIREDTIGER_CACHE_GB:-0.5}"]
    mem_limit: ${MONGO_MEMORY_LIMIT:-1g}
    cpus: ${MONGO_CPUS:-1.0}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-aether}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-oracle}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-astor_unlock}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x mongod >/dev/null"]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    container_name: astor_kafka_test
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
    ports:
      - "${KAFKA_PORT:-9092}:19092"
      - "${SCHEMA_REGISTRY_PORT:-8082}:8081"
    volumes:
      - kafkadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health >/dev/null 2>&1"]
      interval: 45s
      timeout: 10s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: astor_redpanda_console
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8081}:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: astor_debezium_connect
    ports:
      - "${DEBEZIUM_CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: astor-debezium-connect
      CONFIG_STORAGE_TOPIC: astor.connect.configs
      OFFSET_STORAGE_TOPIC: astor.connect.offsets
      STATUS_STORAGE_TOPIC: astor.connect.statuses
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  natasha-nlu:
    profiles: ["nlu"]
    build:
      context: .
      dockerfile: docker/nlu/natasha/Dockerfile
    image: astor-natasha-nlu:local
    container_name: astor_natasha_nlu
    mem_limit: ${NATASHA_NLU_MEMORY_LIMIT:-768m}
    cpus: ${NATASHA_NLU_CPUS:-0.75}
    ports:
      - "${NATASHA_NLU_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=2)\""]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  llm-gateway:
    profiles: ["ai"]
    image: nginx:1.27-alpine
    container_name: astor_llm_gateway
    ports:
      - "${OLLAMA_BIND_HOST:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./docker/llm/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ollama-1:
        condition: service_healthy
      ollama-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:11434/llm/health >/dev/null 2>&1"]
      interval: 60s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama-1:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: astor_ollama_1
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-2g}
    cpus: ${OLLAMA_CPUS:-1.0}
    environment:
      OLLAMA_KEEP_ALIVE: ${LLM_OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 120s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ollama-2:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: astor_ollama_2
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-2g}
    cpus: ${OLLAMA_CPUS:-1.0}
    environment:
      OLLAMA_KEEP_ALIVE: ${LLM_OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 120s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: astor_minio_test
    command: server /data --console-address ":9001"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-astor}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-astor_minio_password}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: astor_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-astor-media}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-astor-documents}
      S3_EPHEMERAL_PREFIX: ${S3_EPHEMERAL_PREFIX:-transient}
      S3_VOICE_PREFIX: ${S3_VOICE_PREFIX:-telegram-voice}
      S3_VOICE_TTL_DAYS: ${S3_VOICE_TTL_DAYS:-3}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-astor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-astor_minio_password}
    entrypoint: >
      sh -c 'mc alias set astor http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
      mc mb --ignore-existing astor/"$$S3_BUCKET_MEDIA" &&
      mc mb --ignore-existing astor/"$$S3_BUCKET_DOCUMENTS" &&
      (mc ilm rule add astor/"$$S3_BUCKET_MEDIA" --expire-days "$$S3_VOICE_TTL_DAYS" --prefix "$$S3_EPHEMERAL_PREFIX/$$S3_VOICE_PREFIX/" || true)'

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: astor_prometheus_test
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - postgres
      - redis

  grafana:
    image: grafana/grafana:10.4.3
    container_name: astor_grafana_test
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  mongodata:
  kafkadata:
  ollama_data:
  miniodata:
  huggingface-cache:
  prometheusdata:
  grafanadata:
  scylladata:
  neo4jdata:
  neo4jlogs:
