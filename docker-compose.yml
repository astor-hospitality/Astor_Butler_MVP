services:
  api-gateway:
    image: nginx:1.27-alpine
    container_name: astor_api_gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      ASTOR_BACKEND_UPSTREAM: ${ASTOR_BACKEND_UPSTREAM:-host.docker.internal:8088}
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "host=$${ASTOR_BACKEND_UPSTREAM%:*};
      if [ \"$$host\" != \"host.docker.internal\" ]; then
      until getent hosts \"$$host\" >/dev/null 2>&1; do sleep 1; done;
      fi;
      envsubst '$$ASTOR_BACKEND_UPSTREAM' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf &&
      nginx -g 'daemon off;'"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 10

  c3-agency-frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${C3_FRONTEND_PUBLIC_URL:-http://localhost:3001}
        NEXT_PUBLIC_API_BASE_URL: ${C3_FRONTEND_API_BASE_URL:-http://localhost:8089}
        NEXT_PUBLIC_WEB_CHAT_ENDPOINT: ${C3_FRONTEND_WEB_CHAT_ENDPOINT:-/api/chat}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${C3_FRONTEND_MEDIA_BASE_URL:-}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${C3_FRONTEND_BRAND_LOGO_URL:-/c3ag-logo.svg}
        NEXT_PUBLIC_CLIO_VOICE_ENABLED: ${C3_FRONTEND_CLIO_VOICE_ENABLED:-false}
        NEXT_PUBLIC_CLIO_TTS_ENABLED: ${C3_FRONTEND_CLIO_TTS_ENABLED:-false}
        NEXT_PUBLIC_CLIO_VOICE_TRANSCRIBE_ENDPOINT: ${C3_FRONTEND_CLIO_VOICE_TRANSCRIBE_ENDPOINT:-/api/chat/transcribe}
        NEXT_PUBLIC_CLIO_TTS_ENDPOINT: ${C3_FRONTEND_CLIO_TTS_ENDPOINT:-/api/chat/speak}
        NEXT_PUBLIC_CLIO_TELEGRAM_HANDOFF_ENABLED: ${C3_FRONTEND_CLIO_TELEGRAM_HANDOFF_ENABLED:-false}
        NEXT_PUBLIC_CLIO_TELEGRAM_BOT_USERNAME: ${C3_FRONTEND_CLIO_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_PRODUCT_CARD_SLIDES_AUTOPLAY: ${C3_FRONTEND_PRODUCT_CARD_SLIDES_AUTOPLAY:-false}
    image: c3-agency-frontend:local
    container_name: c3_agency_frontend
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "${C3_FRONTEND_PUBLIC_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  c3flex-astor-butler-bot:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # true = bake the local faster-whisper stack into the image (rollback only; ~1.5 GB).
        STT_LOCAL_WHISPER: ${STT_LOCAL_WHISPER:-false}
    image: astor-butler-mvp:local
    container_name: c3flex_astor_butler_bot
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      SERVER_PORT: 8088
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-oracle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astor_unlock}
      SPRING_LIQUIBASE_CHANGE_LOG: ${SPRING_LIQUIBASE_CHANGE_LOG:-classpath:db/changelog/changelog-master.yaml}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MONGODB_URI: mongodb://${MONGO_USER:-oracle}:${MONGO_PASSWORD:-astor_unlock}@mongo:27017/${MONGO_DB:-aether}?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER_EVENTS_TOPIC: ${KAFKA_USER_EVENTS_TOPIC:-astor.user.events}
      KAFKA_OUTBOX_USER_EVENTS_TOPIC: ${KAFKA_OUTBOX_USER_EVENTS_TOPIC:-astor.user.events}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-astor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-astor_minio_password}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-astor-media}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-astor-documents}
      ASTOR_INSTANCE_ROLE: c3flex_astor_butler_bot
      TELEGRAM_BOT_ENABLED: ${C3FLEX_ASTOR_BUTLER_BOT_ENABLED:-${C3FLEX_TELEGRAM_BOT_ENABLED:-false}}
      TELEGRAM_BOT_USERNAME: ${C3FLEX_ASTOR_BUTLER_BOT_USERNAME:-${C3FLEX_TELEGRAM_BOT_USERNAME:-${TELEGRAM_BOT_USERNAME:-astor_c3fex_bot}}}
      TELEGRAM_BOT_TOKEN: ${C3FLEX_ASTOR_BUTLER_BOT_TOKEN:-${C3FLEX_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}}
      TELEGRAM_PROXY_TYPE: ${TELEGRAM_PROXY_TYPE:-NO_PROXY}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-0}
      TELEGRAM_ADMIN_CHAT_ID: ${C3FLEX_ASTOR_BUTLER_ADMIN_CHAT_ID:-${C3FLEX_TELEGRAM_ADMIN_CHAT_ID:-}}
      TELEGRAM_ANALYTICS_CHAT_ID: ${C3FLEX_ASTOR_BUTLER_ANALYTICS_CHAT_ID:-${C3FLEX_TELEGRAM_ANALYTICS_CHAT_ID:-}}
      TELEGRAM_HOSTESS_CHAT_ID: ${C3FLEX_ASTOR_BUTLER_STAFF_CHAT_ID:-${C3FLEX_TELEGRAM_HOSTESS_CHAT_ID:-}}
      TELEGRAM_SYSTEM_CHAT_ID: ${C3FLEX_ASTOR_BUTLER_SYSTEM_CHAT_ID:-${C3FLEX_TELEGRAM_SYSTEM_CHAT_ID:-}}
      TELEGRAM_SYSTEM_NOTIFICATIONS_ENABLED: ${TELEGRAM_SYSTEM_NOTIFICATIONS_ENABLED:-false}
      ASTOR_OPERATIONAL_PREVIEW_ENABLED: ${C3FLEX_OPERATIONAL_PREVIEW_ENABLED:-false}
      ASTOR_INTENT_EXAMPLES_INGEST_ON_STARTUP: ${ASTOR_INTENT_EXAMPLES_INGEST_ON_STARTUP:-true}
      ASTOR_SEMANTIC_CHUNKS_INGEST_ON_STARTUP: ${ASTOR_SEMANTIC_CHUNKS_INGEST_ON_STARTUP:-true}
      ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER: ${ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER:-model-gateway}
      ASTOR_SEMANTIC_EMBEDDING_MODEL: ${ASTOR_SEMANTIC_EMBEDDING_MODEL:-text-search-doc/latest}
      ASTOR_SEMANTIC_QUERY_EMBEDDING_MODEL: ${ASTOR_SEMANTIC_QUERY_EMBEDDING_MODEL:-text-search-query/latest}
      # ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER=yandex: Yandex text-search embeddings (256), docs/operations/SBER_AI_ACTIVATION.md
      ASTOR_SEMANTIC_EMBEDDING_DIMENSION: ${ASTOR_SEMANTIC_EMBEDDING_DIMENSION:-1536}
      ASTOR_EMBEDDINGS_YANDEX_API_KEY: ${ASTOR_EMBEDDINGS_YANDEX_API_KEY:-}
      ASTOR_EMBEDDINGS_YANDEX_FOLDER_ID: ${ASTOR_EMBEDDINGS_YANDEX_FOLDER_ID:-}
      ASTOR_UNDERSTANDING_LLM_ENABLED: ${ASTOR_UNDERSTANDING_LLM_ENABLED:-false}
      ASTOR_UNDERSTANDING_LLM_MIN_CONFIDENCE: ${ASTOR_UNDERSTANDING_LLM_MIN_CONFIDENCE:-0.70}
      ASTOR_UNDERSTANDING_LLM_TIMEOUT_MS: ${ASTOR_UNDERSTANDING_LLM_TIMEOUT_MS:-6500}
      ASTOR_SCENARIO_REPLY_LLM_ENABLED: ${ASTOR_SCENARIO_REPLY_LLM_ENABLED:-true}
      ASTOR_SCENARIO_REPLY_MAX_RAG_CHARS: ${ASTOR_SCENARIO_REPLY_MAX_RAG_CHARS:-900}
      ASTOR_SCENARIO_REPLY_LLM_TIMEOUT_MS: ${ASTOR_SCENARIO_REPLY_LLM_TIMEOUT_MS:-6500}
      ASTOR_NLU_NATASHA_ENABLED: ${ASTOR_NLU_NATASHA_ENABLED:-false}
      ASTOR_NLU_NATASHA_URL: ${ASTOR_NLU_NATASHA_URL:-http://natasha-nlu:8011/analyze}
      TELEGRAM_UI_CLEANUP_ENABLED: ${TELEGRAM_UI_CLEANUP_ENABLED:-false}
      TELEGRAM_UI_DELETE_USER_MESSAGES_ENABLED: ${TELEGRAM_UI_DELETE_USER_MESSAGES_ENABLED:-false}
      TELEGRAM_QUIET_GUIDE_INTERIOR_VIDEO_OBJECT_KEY: ${TELEGRAM_QUIET_GUIDE_INTERIOR_VIDEO_OBJECT_KEY:-content/aeris/interior/INTERIOR.mp4}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_REDIRECT_URI: ${APP_TELEGRAM_REDIRECT_URI:-http://localhost:8080/auth/telegram/callback}
      LLM_OLLAMA_BASE_URL: ${APP_LLM_OLLAMA_BASE_URL:-http://llm-gateway:11434}
      LLM_OLLAMA_MODEL: ${LLM_OLLAMA_MODEL:-qwen2.5:3b}
      LLM_OLLAMA_FRONTLINE_MODEL: ${LLM_OLLAMA_FRONTLINE_MODEL:-qwen2.5:3b}
      LLM_OLLAMA_QUALITY_MODEL: ${LLM_OLLAMA_QUALITY_MODEL:-qwen2.5:3b}
      LLM_OLLAMA_VISION_MODEL: ${LLM_OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      ASTOR_MODEL_PROVIDER: ${ASTOR_MODEL_PROVIDER:-spring-ai}
      # Sber: ASTOR_MODEL_PROVIDER=cloudru (Cloud.ru Foundation Models) or gigachat (GigaChat API direct).
      # docs/operations/SBER_AI_ACTIVATION.md
      CLOUDRU_BASE_URL: ${CLOUDRU_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      CLOUDRU_MODEL: ${CLOUDRU_MODEL:-}
      CLOUDRU_QUALITY_MODEL: ${CLOUDRU_QUALITY_MODEL:-}
      CLOUDRU_VISION_MODEL: ${CLOUDRU_VISION_MODEL:-}
      CLOUDRU_EMBEDDING_MODEL: ${CLOUDRU_EMBEDDING_MODEL:-}
      CLOUDRU_TIMEOUT_MS: ${CLOUDRU_TIMEOUT_MS:-15000}
      CLOUDRU_MAX_TOKENS: ${CLOUDRU_MAX_TOKENS:-256}
      CLOUDRU_TEMPERATURE: ${CLOUDRU_TEMPERATURE:-0.1}
      CLOUDRU_JSON_MODE: ${CLOUDRU_JSON_MODE:-true}
      GIGACHAT_OAUTH_URL: ${GIGACHAT_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_QUALITY_MODEL: ${GIGACHAT_QUALITY_MODEL:-}
      GIGACHAT_VISION_MODEL: ${GIGACHAT_VISION_MODEL:-}
      GIGACHAT_EMBEDDING_MODEL: ${GIGACHAT_EMBEDDING_MODEL:-Embeddings}
      GIGACHAT_CA_CERT_PATH: ${GIGACHAT_CA_CERT_PATH:-}
      GIGACHAT_TIMEOUT_MS: ${GIGACHAT_TIMEOUT_MS:-15000}
      GIGACHAT_MAX_TOKENS: ${GIGACHAT_MAX_TOKENS:-256}
      GIGACHAT_TEMPERATURE: ${GIGACHAT_TEMPERATURE:-0.1}
      # Server voice: ASTOR_TTS_PROVIDER=salute (Sber SaluteSpeech) or yandex (SpeechKit, YANDEX_SPEECHKIT_*).
      # docs/operations/SBER_AI_ACTIVATION.md, section "TTS через SaluteSpeech".
      ASTOR_TTS_PROVIDER: ${ASTOR_TTS_PROVIDER:-salute}
      ASTOR_TTS_WEB_ENABLED: ${ASTOR_TTS_WEB_ENABLED:-false}
      SALUTE_AUTH_KEY: ${SALUTE_AUTH_KEY:-}
      SALUTE_SCOPE: ${SALUTE_SCOPE:-SALUTE_SPEECH_PERS}
      SALUTE_TTS_VOICE: ${SALUTE_TTS_VOICE:-Nec_24000}
      SALUTE_TTS_FORMAT: ${SALUTE_TTS_FORMAT:-wav16}
      # Telegram voice replies (docs/operations/TELEGRAM_VOICE_REPLIES.md): off | on | auto; needs SALUTE_TTS_FORMAT=opus
      # (salute) or YANDEX_TTS_FORMAT=oggopus (yandex).
      ASTOR_TELEGRAM_VOICE_REPLIES: ${ASTOR_TELEGRAM_VOICE_REPLIES:-off}
      ASTOR_TELEGRAM_VOICE_TIMEOUT_MS: ${ASTOR_TELEGRAM_VOICE_TIMEOUT_MS:-8000}
      ASTOR_TELEGRAM_VOICE_SUMMARY_VIA_MODEL: ${ASTOR_TELEGRAM_VOICE_SUMMARY_VIA_MODEL:-true}
      SALUTE_CA_CERT_PATH: ${SALUTE_CA_CERT_PATH:-${GIGACHAT_CA_CERT_PATH:-}}
      SALUTE_OAUTH_URL: ${SALUTE_OAUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      SALUTE_TTS_URL: ${SALUTE_TTS_URL:-https://smartspeech.sber.ru/rest/v1/text:synthesize}
      YANDEX_SPEECHKIT_API_KEY: ${YANDEX_SPEECHKIT_API_KEY:-}
      YANDEX_SPEECHKIT_FOLDER_ID: ${YANDEX_SPEECHKIT_FOLDER_ID:-}
      YANDEX_SPEECHKIT_TTS_VOICE: ${YANDEX_SPEECHKIT_TTS_VOICE:-alena}
      # mp3, or oggopus for Telegram voice replies with ASTOR_TTS_PROVIDER=yandex.
      YANDEX_TTS_FORMAT: ${YANDEX_TTS_FORMAT:-mp3}
      YANDEX_AI_BASE_URL: ${YANDEX_AI_BASE_URL:-https://llm.api.cloud.yandex.net}
      YANDEX_RESPONSES_BASE_URL: ${YANDEX_RESPONSES_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      YANDEX_AGENT_ID: ${YANDEX_AGENT_ID:-fvt18kmmnas336paia3g}
      YANDEX_AGENT_MODEL: ${YANDEX_AGENT_MODEL:-${YANDEX_MODEL:-yandexgpt-5-lite}}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_IAM_TOKEN: ${YANDEX_IAM_TOKEN:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-yandexgpt-5-lite}
      YANDEX_QUALITY_MODEL: ${YANDEX_QUALITY_MODEL:-yandexgpt-5.1}
      YANDEX_TIMEOUT_MS: ${YANDEX_TIMEOUT_MS:-8000}
      YANDEX_MAX_TOKENS: ${YANDEX_MAX_TOKENS:-256}
      YANDEX_TEMPERATURE: ${YANDEX_TEMPERATURE:-0.1}
      YANDEX_AGENT_ENDPOINT: ${YANDEX_AGENT_ENDPOINT:-}
      LLM_WARMUP_ENABLED: ${LLM_WARMUP_ENABLED:-false}
      LLM_CONNECT_TIMEOUT_MS: ${LLM_CONNECT_TIMEOUT_MS:-5000}
      LLM_READ_TIMEOUT_MS: ${LLM_READ_TIMEOUT_MS:-45000}
      LLM_OLLAMA_KEEP_ALIVE: ${LLM_OLLAMA_KEEP_ALIVE:-30m}
      ASTOR_STT_ENABLED: ${C3FLEX_STT_ENABLED:-false}
      # cloudru (default): Cloud.ru whisper-large-v3 with CLOUDRU_API_KEY above; yandex: SpeechKit v1 sync with
      # YANDEX_SPEECHKIT_API_KEY (Ogg Opus, up to 30 s); local: faster-whisper subprocess
      # (needs the image built with STT_LOCAL_WHISPER=true).
      ASTOR_STT_PROVIDER: ${ASTOR_STT_PROVIDER:-cloudru}
      ASTOR_STT_CLOUDRU_MODEL: ${ASTOR_STT_CLOUDRU_MODEL:-openai/whisper-large-v3}
      ASTOR_STT_COMMAND: ${ASTOR_STT_COMMAND:-python3 /app/stt_faster_whisper.py {file}}
      ASTOR_STT_TIMEOUT_SECONDS: ${ASTOR_STT_TIMEOUT_SECONDS:-90}
      ASTOR_STT_RETRY_TTL_SECONDS: ${ASTOR_STT_RETRY_TTL_SECONDS:-1800}
      ASTOR_STT_MODEL: ${ASTOR_STT_MODEL:-base}
      ASTOR_STT_LANGUAGE: ${ASTOR_STT_LANGUAGE:-ru}
      ASTOR_WEB_ALLOWED_ORIGINS: ${ASTOR_WEB_ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:8090,http://127.0.0.1:8090,http://localhost:8080,http://localhost:8088}
      ASTOR_STT_DEVICE: ${ASTOR_STT_DEVICE:-cpu}
      ASTOR_STT_COMPUTE_TYPE: ${ASTOR_STT_COMPUTE_TYPE:-int8}
      ASTOR_TIMELINE_SCYLLA_ENABLED: ${ASTOR_TIMELINE_SCYLLA_ENABLED:-true}
      ASTOR_TIMELINE_SCYLLA_HOST: scylla
      ASTOR_TIMELINE_SCYLLA_PORT: 9042
      ASTOR_TIMELINE_SCYLLA_DATACENTER: ${ASTOR_TIMELINE_SCYLLA_DATACENTER:-datacenter1}
      ASTOR_TIMELINE_SCYLLA_KEYSPACE: ${ASTOR_TIMELINE_SCYLLA_KEYSPACE:-astor_timeline}
      ASTOR_GRAPH_NEO4J_ENABLED: ${ASTOR_GRAPH_NEO4J_ENABLED:-true}
      ASTOR_GRAPH_NEO4J_URI: bolt://neo4j:7687
      ASTOR_GRAPH_NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      ASTOR_GRAPH_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-astor_graph_password}
      HF_HOME: /root/.cache/huggingface
      JWT_SECRET: ${JWT_SECRET:-local-container-dev-only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      # GigaChat direct API: mount the Russian Trusted Root CA bundle and set GIGACHAT_CA_CERT_PATH to it.
      # - ./certs/russian_trusted_root_ca.pem:/app/certs/russian_trusted_root_ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      scylla:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/actuator/health >/dev/null"]
      interval: 45s
      timeout: 5s
      retries: 20
      start_period: 60s

  aeris-astor-butler-bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # true = bake the local faster-whisper stack into the image (rollback only; ~1.5 GB).
        STT_LOCAL_WHISPER: ${STT_LOCAL_WHISPER:-false}
    image: astor-butler-mvp:local
    container_name: aeris_astor_butler_bot
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      SERVER_PORT: 8089
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-oracle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astor_unlock}
      SPRING_LIQUIBASE_CHANGE_LOG: ${SPRING_LIQUIBASE_CHANGE_LOG:-classpath:db/changelog/changelog-master.yaml}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MONGODB_URI: mongodb://${MONGO_USER:-oracle}:${MONGO_PASSWORD:-astor_unlock}@mongo:27017/${MONGO_DB:-aether}?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER_EVENTS_TOPIC: ${KAFKA_USER_EVENTS_TOPIC:-astor.user.events}
      KAFKA_OUTBOX_USER_EVENTS_TOPIC: ${KAFKA_OUTBOX_USER_EVENTS_TOPIC:-astor.user.events}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-astor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-astor_minio_password}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-astor-media}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-astor-documents}
      ASTOR_INSTANCE_ROLE: aeris_astor_butler_bot
      TELEGRAM_BOT_ENABLED: ${AERIS_ASTOR_BUTLER_BOT_ENABLED:-${AERIS_TELEGRAM_BOT_ENABLED:-${TELEGRAM_BOT_ENABLED_DEV:-true}}}
      TELEGRAM_BOT_USERNAME: ${AERIS_ASTOR_BUTLER_BOT_USERNAME:-${AERIS_TELEGRAM_BOT_USERNAME:-${TELEGRAM_BOT_USERNAME_DEV:-astor_butler_bot}}}
      TELEGRAM_BOT_TOKEN: ${AERIS_ASTOR_BUTLER_BOT_TOKEN:-${AERIS_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN_DEV:-}}}
      TELEGRAM_PROXY_TYPE: ${TELEGRAM_PROXY_TYPE:-NO_PROXY}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-0}
      TELEGRAM_GET_UPDATES_TIMEOUT_SECONDS: ${TELEGRAM_GET_UPDATES_TIMEOUT_SECONDS:-20}
      TELEGRAM_ADMIN_CHAT_ID: ${AERIS_ASTOR_BUTLER_ADMIN_CHAT_ID:-${AERIS_TELEGRAM_ADMIN_CHAT_ID:-${TELEGRAM_ADMIN_CHAT_ID:-}}}
      TELEGRAM_ANALYTICS_CHAT_ID: ${AERIS_ASTOR_BUTLER_ANALYTICS_CHAT_ID:-${AERIS_TELEGRAM_ANALYTICS_CHAT_ID:-${TELEGRAM_ANALYTICS_CHAT_ID:-}}}
      TELEGRAM_HOSTESS_CHAT_ID: ${AERIS_ASTOR_BUTLER_STAFF_CHAT_ID:-${AERIS_TELEGRAM_HOSTESS_CHAT_ID:-${TELEGRAM_HOSTESS_CHAT_ID:-}}}
      TELEGRAM_SYSTEM_CHAT_ID: ${AERIS_ASTOR_BUTLER_SYSTEM_CHAT_ID:-${AERIS_TELEGRAM_SYSTEM_CHAT_ID:-${TELEGRAM_SYSTEM_CHAT_ID:-}}}
      TELEGRAM_SYSTEM_NOTIFICATIONS_ENABLED: ${AERIS_ASTOR_BUTLER_SYSTEM_NOTIFICATIONS_ENABLED:-${AERIS_TELEGRAM_SYSTEM_NOTIFICATIONS_ENABLED:-true}}
      ASTOR_OPERATIONAL_PREVIEW_ENABLED: ${AERIS_OPERATIONAL_PREVIEW_ENABLED:-true}
      ASTOR_INTENT_EXAMPLES_INGEST_ON_STARTUP: ${AERIS_INTENT_EXAMPLES_INGEST_ON_STARTUP:-false}
      ASTOR_SEMANTIC_CHUNKS_INGEST_ON_STARTUP: ${AERIS_SEMANTIC_CHUNKS_INGEST_ON_STARTUP:-true}
      ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER: ${ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER:-model-gateway}
      ASTOR_SEMANTIC_EMBEDDING_MODEL: ${ASTOR_SEMANTIC_EMBEDDING_MODEL:-text-search-doc/latest}
      ASTOR_SEMANTIC_QUERY_EMBEDDING_MODEL: ${ASTOR_SEMANTIC_QUERY_EMBEDDING_MODEL:-text-search-query/latest}
      # ASTOR_SEMANTIC_EMBEDDINGS_PROVIDER=yandex: Yandex text-search embeddings (256), docs/operations/SBER_AI_ACTIVATION.md
      ASTOR_SEMANTIC_EMBEDDING_DIMENSION: ${ASTOR_SEMANTIC_EMBEDDING_DIMENSION:-1536}
