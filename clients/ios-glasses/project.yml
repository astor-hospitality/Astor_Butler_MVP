name: AstorGlassesProbe
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "6.0"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.astor.glasses.iosprobe
    DEVELOPMENT_TEAM: LQ6R8RRR59
    TARGETED_DEVICE_FAMILY: '1'
targets:
  AstorGlassesProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - sdk: MobileCoreServices.framework
      - sdk: MediaPlayer.framework
      - sdk: CallKit.framework
      - sdk: UserNotifications.framework
      - sdk: AppIntents.framework
        weak: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Astor Glasses
        CFBundleLocalizations: [ru, en]
        INAlternativeAppNames:
          - INAlternativeAppName: Астор
            INAlternativeAppNamePronunciationHint: астор
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central, audio]
        NSBluetoothAlwaysUsageDescription: Подключение к вашим очкам для проверки камеры и звука.
        NSBluetoothPeripheralUsageDescription: Подключение к вашим очкам.
        NSBluetoothWhileInUseUsageDescription: Подключение к вашим очкам.
        NSMicrophoneUsageDescription: Вопросы к Астору и пауза в разговоре перед сообщением сотруднику.
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AstorAppIconMT5
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Probe.entitlements
