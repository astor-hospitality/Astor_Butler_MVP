# Frozen experimental spec, not used for the accepted/default build.
# ASTOR_ENABLE_EXPERIMENTAL_WAKE remains 0; positive wake smoke failed.
include:
  - project.yml
options:
  deploymentTarget:
    iOS: '16.4'
targets:
  AstorGlassesProbe:
    sources:
      - path: ${ASTOR_WAKE_MODEL_PATH}
        type: file
        buildPhase: resources
    dependencies:
      - framework: ${ASTOR_WHISPER_XCFRAMEWORK_PATH}
        embed: true
    settings:
      base:
        OTHER_LDFLAGS: $(inherited) -lc++
